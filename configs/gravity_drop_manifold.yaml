# Gravity Drop — Gaussian-Manifold Fracture
# Uses ManifoldSimulator: fracture state lives on Gaussian graph.
# No volumetric phase-field → surface projection.

simulation:
  name: "gravity_drop_manifold"
  description: "Bunny drop with Gaussian-manifold fracture field"
  mode: "deformation"
  use_manifold: true                 # <-- KEY: enables ManifoldSimulator
  output_dir: "output"
  save_frames: true
  save_checkpoint: false

mesh:
  path: "assets/meshes/bunny.obj"
  auto_generate_if_missing: true
  test_mesh_type: "sphere"
  test_mesh_radius: 0.4

particles:
  target_count: 300000
  surface_ratio: 0.5
  use_poisson_sampling: false
  poisson_depth: 8
  normalize_to_unit_cube: true

mpm:
  num_grids: 128
  dt: 1.0e-4
  gravity: [0.0, 0.0, -300.0]
  clip_bound: 0.05
  damping: 0.9995
  particle_chunk: 8192

material:
  preset: null
  constitutive_model: "corotated_phase_field"
  center: [0.5, 0.5, 0.5]
  size: [0.8, 0.8, 0.8]
  density: 1200.0
  youngs_modulus: 1.5e7
  poissons_ratio: 0.25
  Gc: 60000.0
  l0: 0.025
  degradation_exponent: 3.0

# Phase field params (shared with manifold fracture)
phase_field:
  warmup_frames: 3
  dC_max: 0.02
  crack_tip_speed: 15.0
  crack_width: 0.004
  max_total_cracks: 120
  crack_aniso_ratio: 200.0
  branch_angle: 40.0
  branch_min_length: 1
  branch_probability: 0.95
  max_branches_per_path: 10
  nucleation_fraction: 0.15
  max_nucleation_per_frame: 5
  nucleation_min_spacing: 4
  fragmentation_enabled: true
  fragment_damage_threshold: 0.5
  min_fragment_particles: 50

# Manifold-specific fracture params
manifold:
  graph_k: 12                        # kNN neighbors for Gaussian graph
  graph_sigma: 0.03                  # Gaussian kernel bandwidth
  graph_rebuild_every: 5             # Rebuild graph every N frames
  projector_k: 8                     # kNN for MPM→Gaussian projection
  projector_sigma: 0.05              # Projection kernel bandwidth
  material_family: "neutral_reference"
  enable_front_propagation: true
  material_drive_floor: 0.025
  diffuse_damage_gain: 0.16
  diffuse_neighborhood_steps: 2
  fragment_detect_every: 2
  fragment_damage_threshold: 0.50
  min_fragment_particles: 40
  fragment_opening_weight: 0.36
  fragment_active_tip_weight: 0.18
  fragment_recent_front_weight: 0.12
  fragment_pair_break_weight: 0.10
  fragment_edge_memory_decay: 0.975
  fragment_edge_memory_weight: 0.76
  fragment_cut_diffusion_alpha: 0.18
  fragment_cut_diffusion_iters: 1
  fragment_cut_cos_gate_tangent: 0.62
  fragment_cut_cos_gate_normal: 0.52
  fragment_primary_cut_ratio: 0.70
  fragment_fallback_cut_ratio: 0.50
  fragment_min_boundary_edges: 18
  fragment_detached_node_decay: 0.95
  fragment_persistent_min_size: 8
  fragment_component_hysteresis: 0.34
  fragment_post_split_threshold_scale: 0.90
  fragment_impulse_strength: 2.40
  fragment_upward_bias: 0.36
  fragment_visual_offset_scale: 0.010
  fragment_visual_ramp_frames: 6
  fragment_impulse_boost_frames: 4
  fragment_event_boost: 1.0
  fragment_render_gravity: 0.0026
  fragment_render_damping: 0.985
  fragment_render_lateral_damping: 0.992
  fragment_render_gap_scale: 1.55
  fragment_render_velocity_scale: 0.22
  fragment_render_min_size: 6
  fragment_render_overlap_threshold: 0.24
  shard_enable: false
  shard_count_scale: 0.0
  fragment_offset_gain: 1.0
  debris_motion_gain: 0.0
  cut_surface_enable: false
  cut_vote_strength: 0.0
  tau_cross: 0.60
  tau_tangent: 0.45
  cut_core_damage_threshold: 0.18
  cut_core_opening_threshold: 0.16
  cut_hard_break_threshold: 0.42
  authoritative_cut_decay: 0.96
  authoritative_cut_threshold: 0.20
  support_loss_enable: true
  support_anchor_quantile: 0.10
  support_release_threshold: 0.56
  support_promote_min_size: 6
  support_overlap_threshold: 0.10
  aniso_ratio: 1.0                   # 1.0 = isotropic (no directional bias)
  damage_source_scale: 0.35          # Physics-driven advance at crack front
  damage_spread: 0.36                # Neutral baseline: narrower than rough quasi-brittle
  drive_quantile: 0.58               # Neutral baseline: avoid overly broad activation
  front_threshold: 0.05              # Require local crack/front support before growing
  radial_bias: 2.50                  # Bias crack-front propagation away from the impact seed
  tip_propagation_scale: 0.75        # Aggressive front advance along favored edges
  front_substeps: 2                  # Base crack-front substeps per frame
  tau_init: 0.30                     # Neutral reference seed threshold
  growth_gain: 0.92                  # Neutral reference front advance gain
  band_width: 1.25                   # Neutral reference local crack band width
  band_fill_gain: 0.24               # Neutral reference band fill
  open_gain: 0.88                    # Neutral reference opening
  edge_break_rate: 0.92              # Neutral reference fragmentation tendency
  branching_bias: 0.16               # Neutral reference branching
  anisotropy_strength: 0.10          # Higher = stronger alignment to growth direction
  seed_quantile: 0.995               # Sparse initial seed selection
  successor_topk: 2                  # Max successors per active crack tip
  min_successor_score: 0.25          # Min score needed to advance the front
  branch_score_ratio: 0.97           # Allow branching when 2nd score is close to 1st
  branch_drive_threshold: 0.70       # Min drive for a branch candidate
  max_branching_tips: 12             # Keep branching bounded for stability
  opening_scale: 0.03                # Crack opening displacement scale
  impact_seed_radius_factor: 0.08    # Seed only the local contact patch on impact
  impact_seed_magnitude: 0.18        # Initial impact damage seed
  impact_seed_H_multiplier: 0.0      # Avoid broad permanent pre-damage at impact
  damage_feedback_delay_frames: 8    # Wait this many post-impact frames before degrading MPM stiffness
  damage_feedback_ramp_frames: 6     # Smoothly ramp damage->stress feedback back in
  interior_damage_scale: 0.20        # Interior particles receive weaker projected damage
  volumetric_cut_damage_scale: 0.58  # Extra volumetric weakening along authoritative crack corridors
  volumetric_auth_damage_floor: 0.72 # Minimum damage assigned to authoritative cut surfaces
  volumetric_detached_damage_floor: 0.90 # Minimum damage assigned to support-lost / detached fragments
  fragment_physical_gap_scale: 0.0000    # Physical per-substep gap drift for released fragments
  fragment_physical_release_velocity: 0.0000 # Physical velocity bias for released fragments
  fragment_physical_downward_bias: 0.32     # Bias released chunks to fall instead of hover
  fragment_physical_release_frames: 20      # Duration of the physical release drift after split
  drive_tension_weight: 1.00         # Weight of pure tensile energy in fracture drive
  drive_shear_weight: 0.35           # Weight of deviatoric/shear stress in fracture drive
  drive_principal_weight: 0.25       # Weight of principal tensile stress in fracture drive
  drive_kinetic_weight: 0.15         # Weight of relative particle motion in fracture drive
  splitting_enabled: false            # Gaussian splitting (Phase 3, experimental)
  split_threshold: 0.8               # Damage threshold for Gaussian split
  opacity_threshold: 0.6             # Damage threshold for opacity reduction
  flatten_threshold: 0.3             # Damage threshold for covariance flattening
  max_flatten: 0.5                   # Maximum scale reduction along crack normal
  max_opacity_reduction: 0.8         # Maximum opacity reduction

seismic:
  enabled: true
  amplitude: 1500.0
  frequency: 80.0
  direction: [1.0, 0.3, 0.0]
  ramp_time: 0.005

pre_notch:
  enabled: false

external_force:
  enabled: false

ground_plane:
  enabled: true
  point: [0.5, 0.5, 0.05]
  normal: [0.0, 0.0, 1.0]
  surface_type: "slip"
  friction: 0.5

loading:
  type: "gravity_drop"
  fixed_gravity_z: -2000.0            # Strong gravity for fast impact
  drop_scale: 0.33
  drop_center_z: 0.7
  drop_rotation: [30.0, 20.0, 0.0]

coordinate_mapping:
  world_center: [0.5, 0.5, 0.5]
  world_scale: 1.0

# Still needed for legacy compat (ForwardEngine reads it)
damage_projection:
  method: "knn_weighted"
  k_neighbors: 8
  influence_radius: 0.05
  damage_threshold: 0.01
  use_faiss: true

gaussian_splatting:
  material_family: "neutral_reference"
  sh_degree: 3
  pretrained_ply: null
  pretrained_scale_multiplier: 1.0
  crack_color: [0.6, 0.08, 0.08]
  opacity_mode: "smooth"
  color_mode: "overlay"
  scale_mode: null
  damage_threshold: 0.22
  sharp_k: 50.0
  edge_width: 0.02
  crack_opacity_reduction: 0.88
  crack_max_opening: 0.018
  crack_gap_fraction: 0.60
  crack_edge_darken: 1.10
  crack_red_accent: 0.20
  crack_tip_scale_boost: 0.22
  crack_tip_opacity_boost: 0.10
  crack_band_weight: 0.80
  crack_visited_weight: 0.45
  crack_tip_weight: 0.95
  crack_core_weight: 1.00
  split_gap_gain: 1.0
  fragment_shell_gain: 1.0
  fragment_contrast_gain: 1.0
  debris_darkening: 0.20
  shard_scale_gain: 1.0
  shard_opacity_gain: 1.0
  damage_scale_shrink: 0.50
  damage_center_opacity_reduction: 0.70
  diffuse_damage_strength: 0.12

rendering:
  image_width: 1920
  image_height: 1920
  background_color: [1.0, 1.0, 1.0]
  camera:
    distance: 0.85
    elevation: 25.0
    azimuth: 30.0
    fov: 50.0
    target: [0.5, 0.5, 0.30]
  total_frames: 200
  fps: 30
  physics_substeps: 15

output:
  video_path: "output/manifold_fracture.mp4"
  frame_dir: "output/frames"
  statistics_log: "output/statistics.csv"
  checkpoint_dir: "output/checkpoints"
  log_interval: 50
  verbose: true

device:
  type: "cuda"
  gpu_id: 0
